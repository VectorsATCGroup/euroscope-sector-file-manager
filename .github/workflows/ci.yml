name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Vectors.EuroScopeUpdater.sln

      - name: Build
        run: dotnet build Vectors.EuroScopeUpdater.sln -c Release --no-restore

      - name: Test
        run: dotnet test Vectors.EuroScopeUpdater.sln -c Release --no-build --verbosity normal
